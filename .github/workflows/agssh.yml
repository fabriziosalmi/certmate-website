name: AGSSH conformance

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agssh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: AGSSH scan (report mode — does not gate yet)
        id: agssh
        continue-on-error: true
        # Pinned to a commit, like every other action in this repository,
        # including slopless, which is also first-party. v1 is a moving tag:
        # whatever it points at runs here with this repository checked out,
        # and the pull request that added this line described it as SHA
        # pinned. v1 resolved to this commit on 2026-09-16 (agssh v1.6.0).
        uses: fabriziosalmi/agssh@afa1d046b35f03aca79e4b521c3d8c77b2161a86 # v1.6.0
        with:
          config: .airgap.yml
          badge: agssh-badge.svg
      - name: Verdict
        run: echo "conformant=${{ steps.agssh.outputs.conformant }} report=${{ steps.agssh.outputs.report }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agssh-conformance
          path: |
            agssh-badge.svg
            agssh-report.json
