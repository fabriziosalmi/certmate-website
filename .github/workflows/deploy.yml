name: Build and deploy Astro to GitHub Pages

# Build the site on every push to main + on demand.
# Replaces the previous Jekyll auto-build that GitHub Pages did natively;
# now the static output of `astro build` is what gets served.

on:
  push:
    branches: [main]
  # Build pull requests too: without this a broken build only surfaced after
  # it was merged to the branch that publishes. The deploy job is gated on
  # the event, so a PR builds but never publishes.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Single concurrent deploy per ref — newer pushes cancel an in-flight job
# so the deployment always reflects the latest commit.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Read-only at the top; the write scopes sit on the job that actually
# publishes. The build job runs `npm ci` and `npm run build`, which executes
# install scripts and framework code from the dependency tree — it has no
# business inheriting the ability to write a Pages deployment or mint an OIDC
# token. Same split the main repo uses for its publishing workflows.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          # Astro picks up `site:` from astro.config.mjs; this is just here so
          # any custom prerender step that reads `process.env.SITE` works too.
          SITE: https://www.certmate.org

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  deploy:
    needs: build
    # Never from a pull request — a PR only proves the site builds.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
