<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertMate Documentation</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <style>
        /* Pagefind search wrapper — sits under the docs hero subtitle.
           Capped to 560px so it does not feel boundless on wide
           viewports. Margin-top creates the breathing room between
           the subtitle and the search box. */
        .docs-search-wrapper { max-width: 560px; margin: 32px auto 0; }
    </style>
    <link rel="preload" href="vendor/font-awesome/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="vendor/font-awesome/all.min.css"></noscript>
    <link rel="preload" as="style" href="vendor/fonts/fonts.css" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="vendor/fonts/fonts.css"></noscript>
</head>
<body>
    <!-- Navigation -->
    <!-- SITE_HEADER: the site header, rendered by src/lib/docs-shell.ts -->

    <!-- Main content -->
    <main id="main-content">
        <!-- Header -->
        <section class="docs-hero">
            <div class="container">
                <h1 class="docs-title"><i class="fas fa-book"></i> CertMate Documentation</h1>
                <p class="docs-subtitle">Everything you need to get started with CertMate SSL certificate management</p>

                <!-- Pagefind search. The pagefind-ui assets at
                     /pagefind/ are generated by the post-build step
                     (`npm run index`); the UI auto-initialises on
                     DOMContentLoaded against that index. Offline-
                     friendly (everything client-side after first
                     load), zero third-party services. -->
                <link rel="stylesheet" href="/pagefind/pagefind-ui.css" />
                <div id="search" class="docs-search-wrapper"></div>
                <script src="/pagefind/pagefind-ui.js"></script>
                <script>
                    window.addEventListener('DOMContentLoaded', function () {
                        if (typeof PagefindUI === 'undefined') return; // index not built (dev)
                        new PagefindUI({
                            element: '#search',
                            showSubResults: true,
                            resetStyles: false,
                            placeholder: 'Search docs (Ctrl K)',
                        });
                        // Cmd/Ctrl+K to focus the search input.
                        document.addEventListener('keydown', function (e) {
                            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                                e.preventDefault();
                                document.querySelector('#search input')?.focus();
                            }
                        });
                    });
                </script>
            </div>
        </section>

        <!-- DOCS_INDEX: the sections and cards, rendered by src/lib/docs-shell.ts from DOC_GROUPS in src/data/docs.ts -->

        <!-- Quick Links -->
        <section class="docs-quick-links">
            <div class="container">
                <h2>Quick Links</h2>
                <div class="quick-links-grid">
                    <a href="https://github.com/fabriziosalmi/certmate" target="_blank" rel="noopener noreferrer" class="quick-link">
                        <i class="fab fa-github"></i>
                        <span>GitHub Repository</span>
                    </a>
                    <a href="https://hub.docker.com/r/fabriziosalmi/certmate" target="_blank" rel="noopener noreferrer" class="quick-link">
                        <i class="fab fa-docker"></i>
                        <span>Docker Hub</span>
                    </a>
                    <a href="https://github.com/fabriziosalmi/certmate/issues" target="_blank" rel="noopener noreferrer" class="quick-link">
                        <i class="fas fa-bug"></i>
                        <span>Report Issues</span>
                    </a>
                    <a href="https://github.com/fabriziosalmi/certmate/discussions" target="_blank" rel="noopener noreferrer" class="quick-link">
                        <i class="fas fa-comments"></i>
                        <span>Discussions</span>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <!-- SITE_FOOTER: the site footer, rendered by src/lib/docs-shell.ts -->
</body>
</html>
